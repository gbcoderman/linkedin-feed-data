name: Update LinkedIn Feed

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual run

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # This opts you into the new system GitHub is asking for
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

    steps:
      # Updated to v4/v5 which support the new Node versions
      - name: Checkout Repo
        uses: actions/checkout@v4 

      - name: Set up Python
        uses: actions/setup-python@v5 
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Python script
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
        run: python linkedin_script.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add linkedin_data.json
          git commit -m "Update LinkedIn feed data" || exit 0
          git push
